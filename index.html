<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>KO Circuit</title>
  <meta name="description" content="KO Circuit: an original NES-style tell-and-counter boxing game. Plays in the browser, on a phone or a tablet, and offline once installed.">
  <meta name="theme-color" content="#05060c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KO Circuit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; position: fixed; inset: 0;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="screen" width="256" height="224"></canvas></div>
  <noscript>KO Circuit needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/pwa.js"></script>
</body>
</html>
